[package]
name = "sss-help"
version = "0.0.1"
edition = "2021"
authors = ["Josep Bigorra <jjbigorra@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Help screen for SSS (Supreme Sexp System) using GTK4 and LibAdwaita"
readme = "README.org"
homepage = "https://codeberg.org/jjba23/sss-help"
repository = "https://codeberg.org/jjba23/sss-help"
keywords = []
categories = []

[dependencies]
adw = { version = "0.6.0", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.8.0", package = "gtk4", features = ["v4_14"] }
serde = "1.0.216"
log = "0.4"
base16ct = "0.2.0"
serde_json = "1.0.134"

[profile.release]
codegen-units = 1
lto = true
